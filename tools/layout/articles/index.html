<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>图文阅读编辑器</title>
  <link rel="stylesheet" href="./styles.css?v=e584159048f79e2b">
</head>
<body>
  <main class="article-shell">
    <section class="controls" aria-labelledby="editor-heading">
      <header class="component-heading"><h1 id="editor-heading">图文阅读</h1><span id="save-state">示例</span></header>
      <form id="editor-form" autocomplete="off">
        <div class="two-columns">
          <label class="field">阅读版式<select id="article-template"><option value="A">图文卡 A</option><option value="C">手机阅读 C</option></select></label>
          <label class="field" id="mode-field">正文模式<select id="content-mode"><option value="illustrated">图文</option><option value="text">纯文字</option></select></label>
        </div>
        <div class="two-columns">
          <label class="field" id="format-field">画幅<select id="canvas-format"><option value="3:5">3 : 5</option><option value="3:4">3 : 4</option></select></label>
          <label class="field">配色<select id="palette"><option value="sage">深灰绿</option><option value="brown">茶褐</option></select></label>
        </div>
        <label class="field">文章标题<input id="title" type="text" placeholder="用于页眉，不重复放入正文"></label>
        <label class="field">正文<textarea id="body" rows="12" spellcheck="false" placeholder="粘贴全文。用 ## 章节、> 引用、**重点** 或 __下划线__ 排版。"></textarea><span id="body-count" class="field-note"></span></label>
        <div class="input-actions"><button type="button" id="import-text">导入 MD／TXT</button><button type="button" id="add-image">插入图片</button></div>
        <input id="text-file" type="file" accept=".md,.txt,text/plain,text/markdown" hidden>
        <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
        <div id="image-list" class="image-list"></div>
        <div class="two-columns identity-fields">
          <label class="field">页脚署名<input id="author" type="text" placeholder="选填"></label>
          <label class="field">账号名称<input id="account" type="text" placeholder="选填"></label>
        </div>
        <details id="advanced" class="adjustments">
          <summary>微调版面</summary>
          <label class="field">自定页眉<input id="header-text" type="text" placeholder="不填则使用文章标题"></label>
          <div class="two-columns">
            <label class="range-field">正文字号 <output data-for="body-size"></output><input id="body-size" type="range" min="28" max="96" step="1"></label>
            <label class="range-field">章节字号 <output data-for="heading-size"></output><input id="heading-size" type="range" min="36" max="140" step="1"></label>
            <label class="range-field">行距 <output data-for="line-height"></output><input id="line-height" type="range" min="1.2" max="2.6" step=".01"></label>
            <label class="range-field">段间距 <output data-for="paragraph-gap"></output><input id="paragraph-gap" type="range" min="0" max="120" step="1"></label>
            <label class="range-field">左右留白 <output data-for="side"></output><input id="side" type="range" min="24" max="600" step="2"></label>
            <label class="range-field">上方留白 <output data-for="top"></output><input id="top" type="range" min="140" max="700" step="2"></label>
            <label class="range-field">下方留白 <output data-for="bottom"></output><input id="bottom" type="range" min="120" max="700" step="2"></label>
          </div>
          <div class="two-columns"><label class="field">正文对齐<select id="text-align"><option value="justify">两端对齐</option><option value="left">左对齐</option><option value="center">居中</option></select></label><label class="field">页脚<select id="footer-style"><option value="author-number">署名与页码</option><option value="center-number">仅居中页码</option></select></label></div>
          <button type="button" class="quiet" id="reset-layout">恢复当前版式参数</button>
        </details>
        <p id="layout-errors" class="error" role="alert" hidden></p>
        <p id="layout-warnings" class="field-note" hidden></p>
        <div class="standalone-actions">
          <div class="project-actions"><button type="button" class="primary" id="download-png">下载本页 PNG</button><button type="button" id="download-all">下载全部 ZIP</button><button type="button" id="save-project">保存工程</button><button type="button" id="load-project">载入工程</button></div>
          <details class="feedback"><summary>需要AI调整</summary><label class="field">想调整什么<textarea id="feedback-notes" rows="3" placeholder="将说明、工程和当前预览一起下载，再交给AI。"></textarea></label><button type="button" id="download-feedback">下载反馈包</button></details>
        </div>
        <input id="project-file" type="file" accept="application/json,.json" hidden>
        <p id="status" class="status" role="status" aria-live="polite">正在准备预览…</p>
      </form>
    </section>
    <section class="preview-pane" aria-labelledby="preview-heading">
      <header class="preview-heading"><h2 id="preview-heading">成品预览</h2><span id="dimensions"></span></header>
      <div class="canvas-wrap"><canvas id="article-canvas" width="1440" height="2400" role="img" aria-label="图文阅读成品预览"></canvas></div>
      <nav class="pagination" aria-label="翻页预览"><button type="button" id="prev-page" aria-label="上一页">←</button><output id="page-count" aria-live="polite"></output><button type="button" id="next-page" aria-label="下一页">→</button></nav>
    </section>
  </main>
  <script type="module" src="./app.mjs?v=e584159048f79e2b"></script>
</body>
</html>
