<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>公众号封面编辑器 · 茶叶的实验室</title><link rel="stylesheet" href="../cover/style.css?v=e584159048f79e2b"><link rel="stylesheet" href="../cover/theme.css?v=e584159048f79e2b"><link rel="stylesheet" href="../cover/studio.css?v=e584159048f79e2b"><link rel="stylesheet" href="../cover/embed.css?v=e584159048f79e2b"></head><body class="paper-editor cover-editor"><div id="editorApp" inert>
<header><div class="editor-heading"><a class="editor-back" href="../layout/index.html?editor=cover">← 排版工作室</a><h1>公众号封面编辑器</h1></div><nav class="editor-profiles" aria-label="选择编辑器"><a href="../cover/index.html" aria-current="page">公众号封面</a><a href="../poster/index.html" >图文首页图</a></nav><div class="actions"><button id="saveDesign">保存方案</button><label class="file-button">载入方案<input id="loadDesign" type="file" accept=".json,application/json"></label><button id="showSample">套用排版示例</button></div></header>
<main class="workspace"><section class="stage"><section class="quick-editor" aria-label="快速编辑"><div class="actions"><select id="templateSelect" aria-label="选择封面模板"></select><button id="applyTemplate">套用模板</button></div><div class="quick-grid"><div class="quick-title"><div class="quick-heading"><label for="quick-title">标题</label><label><input id="quick-title-enabled" type="checkbox">显示</label></div><textarea id="quick-title" maxlength="2000" placeholder="输入标题，支持换行"></textarea></div><div><div class="quick-heading"><label for="quick-subtitle">副标题</label><label><input id="quick-subtitle-enabled" type="checkbox">显示</label></div><textarea id="quick-subtitle" maxlength="2000" placeholder="选填"></textarea></div><div><div class="quick-heading"><label for="quick-author">作者</label><label><input id="quick-author-enabled" type="checkbox">显示</label></div><input id="quick-author" maxlength="2000" placeholder="选填"></div></div><p class="hint">输入即显示。套用模板会替换排版；只换底图会保留文字。</p></section><div class="toolbar"><div class="actions"><select id="artSelect" class="art-select" aria-label="选择底图"></select><a class="browse-backgrounds" href="#background-library">看底图库 ↓</a></div><div class="actions"><button id="modeWide" class="active" aria-pressed="true">横版</button><button id="modeSquare" aria-pressed="false">方版</button><select id="posterFormat" aria-label="竖版画幅" hidden><option value="3:4">3:4 · 通用图文</option><option value="3:5">3:5 · 长图文</option></select><span id="dimensions" class="width-label">1880 × 800</span></div></div>
<div id="canvasShell" class="canvas-shell"><canvas id="preview" width="1880" height="800" data-mode="wide" aria-label="封面画布，可拖动可见元素"></canvas></div>
<div class="exportbar"><button id="downloadCurrent" class="primary">导出当前封面</button><button id="downloadBackground">只导出底图</button><button id="downloadUpload">导出双裁切母图</button><select id="format" aria-label="导出格式"><option value="png">PNG</option><option value="jpeg">JPG</option></select></div><div id="status" role="status">正在加载字体与底图…</div><div id="draftStatus" role="status">正在检查本机暂存…</div><div id="warnings" role="alert"></div>
<p class="hint">点击或拖动画布中的元素。文字与开关同步到横版、方版；位置与字号可分别调整。</p>
<details class="panel"><summary>底图位置与画布</summary><div class="details-body bg-controls"><div><label class="field"><span>方版底图布局</span><select id="squareBgMode"><option value="editorial">上方留白，下方画面</option><option value="cover">图片铺满</option></select></label><label class="field"><span>画布底色</span><input id="paperColor" type="color"></label><div id="paperSwatches" class="color-swatches" role="group" aria-label="常用画布底色"></div></div><div><label class="field"><span>当前画幅 · 水平取景</span><input id="focusX" type="range" min="0" max="100"></label><label class="field"><span>当前画幅 · 垂直取景</span><input id="focusY" type="range" min="0" max="100"></label></div><div><label class="field"><span>当前画幅 · 图片缩放</span><input id="bgZoom" type="range" min="100" max="240" step="1"></label><label class="file-button">替换标志<input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"></label></div></div></details>
</section><aside class="sidebar"><section class="panel background-panel" id="background-library"><div class="panel-heading"><h2>底图库</h2><select id="artCategory" aria-label="底图风格"><option value="all">全部风格</option><option value="纸张">纸张</option><option value="油画">油画</option><option value="纸艺">纸艺</option><option value="寻璞">寻璞系列</option></select></div><div id="artGallery" class="art-gallery" aria-label="底图选项"></div><label class="file-button upload-background">上传自己的底图<input id="backgroundFile" type="file" accept="image/png,image/jpeg,image/webp"></label><p class="hint">PNG、JPG、WebP，20MB以内。图片仅留在你的浏览器。</p></section>
<details class="panel material-panel"><summary>自己生成底图</summary><div class="details-body"><canvas id="materialPreview" width="320" height="210" aria-label="自选材质效果预览"></canvas><label class="field"><span>材质</span><select id="materialStyle"><option value="paper">纤维纸张</option><option value="canvas">细纹画布</option><option value="wash">淡彩晕染</option><option value="cutpaper">叠放拼纸</option></select></label><div class="row"><label class="field"><span>底色</span><input id="materialBase" type="color" value="#f3eee2"></label><label class="field"><span>强调色</span><input id="materialAccent" type="color" value="#809185"></label></div><div id="materialPalettes" class="material-palettes" aria-label="材质配色"></div><label class="field"><span>材质强度</span><input id="materialIntensity" type="range" min="0" max="100" value="55"></label><div class="actions"><button id="shuffleMaterial" type="button">换个纹理</button><button id="applyMaterial" type="button" class="primary">用这张底图</button></div><p class="hint">颜色与纹理在本机生成，可单独导出底图。</p></div></details>
<section class="panel"><h2>元素</h2><div class="actions" style="margin-bottom:12px"><button id="hideAll" class="minor">全部隐藏</button><button id="showAll" class="minor">显示已填内容</button></div><div id="layers"></div><div class="actions" style="margin-top:12px"><button id="addText" class="minor">＋ 自定义文字</button></div></section>
<section class="panel" id="propertyPanel"><h2 id="propertyTitle">标题</h2><div id="emptyProperty" class="hidden">选择一个元素继续编辑。</div><div id="properties"><label class="fieldline"><input type="checkbox" id="elementEnabled">显示此元素</label><div id="textControls"><label class="field"><span>内容（支持换行）</span><textarea id="elementText" maxlength="2000"></textarea></label><div class="row"><label class="field"><span>字体</span><select id="elementFont"><option value="cn">思源宋体</option><option value="article">宋体</option><option value="en">Source Serif 4</option><option value="sans">系统黑体</option></select></label><label class="field"><span>颜色</span><input id="elementColor" type="color"></label></div><div id="elementSwatches" class="color-swatches" role="group" aria-label="常用元素颜色"></div></div><label class="fieldline hidden" id="brandAlignmentControl"><input id="alignLogoBottom" type="checkbox">对齐标志下沿（当前画幅）</label>
<div class="row"><label class="field"><span id="sizeLabel">字号</span><input id="elementSize" type="number" min="8" max="800" step="1"></label><label class="field"><span>不透明度 %</span><input id="elementOpacity" type="number" min="0" max="100"></label></div><div class="row"><label class="field"><span>横坐标</span><input id="elementX" type="number" step="1"></label><label class="field"><span>纵坐标</span><input id="elementY" type="number" step="1"></label></div>
<div id="textLayoutControls"><div class="row"><label class="field"><span>文本框宽度</span><input id="elementWidth" type="number" min="20" max="1880"></label><label class="field"><span>行距倍数</span><input id="elementLineHeight" type="number" min="0.8" max="3" step="0.05"></label></div><label class="field"><span>对齐</span><select id="elementAlign"><option value="left">左对齐</option><option value="center">居中</option><option value="right">右对齐</option></select></label></div>
<div class="actions"><button id="moveUp" class="minor">上移一层</button><button id="moveDown" class="minor">下移一层</button><button id="deleteElement" class="minor danger">删除</button></div></div></section></aside></main>
<dialog id="exportDialog" aria-labelledby="exportTitle"><div class="export-heading"><h2 id="exportTitle">封面已生成</h2><button id="closeExport" type="button">继续编辑</button></div><img id="exportPreview" alt="导出的干净封面" hidden><p id="exportFilename"></p><p id="exportDetails"></p><a id="exportLink" download>下载图片</a><p id="exportHelp" class="hint"></p></dialog></div><script>window.EDITOR_PROFILE='cover';</script><script src="../cover/config.js?v=e584159048f79e2b" defer></script><script src="../cover/model.js?v=e584159048f79e2b" defer></script><script src="../cover/background-maker.js?v=e584159048f79e2b" defer></script><script src="../cover/cover.js?v=e584159048f79e2b" defer></script><script src="../cover/bridge.js?v=e584159048f79e2b" defer></script></body></html>
